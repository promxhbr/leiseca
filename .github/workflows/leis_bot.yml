name: Monitor e Extrator de Leis

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de execução'
        required: false
        default: 'verificar_todas'
        type: choice
        options:
          - verificar_todas
          - extrair_pendentes
          - verificar_lei
          - reprocessar_indice_lei
          - reprocessar_todos_indices
      lei_id:
        description: 'ID específico da lei (opcional)'
        required: false
        default: ''
        type: string

jobs:
  executar-extrator:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Executar robô extrator e verificador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO_EXECUCAO: ${{ github.event.inputs.modo || 'verificar_todas' }}
          LEI_ID_ALVO: ${{ github.event.inputs.lei_id || '' }}
        run: python scripts/parser_leis.py
